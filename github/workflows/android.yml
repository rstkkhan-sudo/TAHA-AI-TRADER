
name: TAHA AI TRADER APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android source
        id: project
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

          PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAHA-AI-TRADER-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
